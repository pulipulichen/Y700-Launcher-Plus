name: Phase 0 Android build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-phase0.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phase0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Compile and lint
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug

      - name: Prepare release assets
        shell: bash
        run: |
          apk_path="$RUNNER_TEMP/Y700-Launcher-Plus-phase0-debug.apk"
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_path"
          sha256sum "$apk_path" > "$apk_path.sha256"

      - name: Publish Phase 0 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_tag="phase0-latest"
          apk_path="$RUNNER_TEMP/Y700-Launcher-Plus-phase0-debug.apk"
          checksum_path="$apk_path.sha256"
          release_notes="Current Phase 0 debug APK for on-device ZUI taskbar testing. Source commit: $GITHUB_SHA; Actions run: $GITHUB_RUN_ID."
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk_path" "$checksum_path" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --title "Y700 Launcher Plus Phase 0 (latest)" --notes "$release_notes" --prerelease
          else
            gh release create "$release_tag" "$apk_path" "$checksum_path" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Y700 Launcher Plus Phase 0 (latest)" --notes "$release_notes" --prerelease
          fi
