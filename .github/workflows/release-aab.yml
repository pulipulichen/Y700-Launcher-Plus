name: Signed Google Play upload AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable tag, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: y700-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Use vMAJOR.MINOR.PATCH."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; version tags are immutable."
            exit 1
          fi
      - name: Restore and verify permanent signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_PASSWORD" && -n "$SIGNING_KEY_ALIAS" ]] || { echo "::error::All four SIGNING_* secrets are required."; exit 1; }
          umask 077
          mkdir -p signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          test -s signing/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_PASSWORD" "$SIGNING_KEY_ALIAS" > signing/signing.properties
          keytool -list -keystore signing/release.keystore -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          fp="$(keytool -exportcert -rfc -keystore signing/release.keystore -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)"
          [[ "$fp" == '8F:4C:5A:D0:18:AA:5F:E5:32:C4:F1:FF:12:60:EF:08:02:82:48:9D:C6:D2:03:2A:5E:BD:62:AF:18:EE:54:B3' ]] || { echo "::error::Permanent certificate mismatch."; exit 1; }
      - name: Build and verify signed AAB
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version_code=$(( $(date -u +%s) / 60 ))
          version_name="$(printf '%s' "$RELEASE_TAG" | cut -c2-)"
          gradle --no-daemon --console=plain -PappVersionCode="$version_code" -PappVersionName="$version_name" :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null
          rm -f signing/release.keystore signing/signing.properties
      - name: Publish AAB
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          name="Y700-Launcher-Plus-$RELEASE_TAG.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$name" "$RUNNER_TEMP/$name.sha256" --title "Y700 Launcher Plus $RELEASE_TAG" --notes "Permanent-signed Google Play upload bundle. Commit: $GITHUB_SHA." --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
